name: Nix build

# Builds a flake package the way users install it: through a `github:`
# reference, from the archive GitHub serves. Only that archive has VERSION
# filled in, so only this build reports the tag, and only this build is the
# one an install looks up in the cache. A build from a checkout would be
# neither.
#
# Called with a release tag, it also fails unless the package is that
# release: its derivation version is the tag's, and, when it names a program,
# `--version` prints it.
on:
  workflow_call:
    inputs:
      ref:
        description: >-
          The tag or commit to build. Defaults to the commit the calling run
          is for (a pull request's head commit, not its merge commit).
        type: string
        default: ""
      dir:
        description: The directory of the flake within the repository, when it is not the root.
        type: string
        default: ""
      packages:
        description: The package attributes to build, separated by spaces.
        type: string
        default: default
      runners:
        description: A JSON array of the runners to build on, one per system the cache should serve.
        type: string
        default: '["ubuntu-latest", "ubuntu-24.04-arm", "macos-latest"]'
      timeout-minutes:
        description: How long one runner may take, for builds that compile from scratch when the cache is cold.
        type: number
        default: 60
      cachix-cache:
        description: The Cachix cache to read from, and to push to when a token is given.
        type: string
        default: ""
      cachix-pin:
        description: >-
          A pin name to keep each build under in the cache, so cache retention
          never collects it: `<pin>-<system>` for the default package and
          `<pin>-<package>-<system>` for any other. Needs the token.
        type: string
        default: ""
    secrets:
      cachix-auth-token:
        description: Lets the build be pushed to the cache. Without it the cache is only read.
        required: false

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.runners) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # Every value reaches the scripts through the environment, so none of its
    # text can be read as shell.
    env:
      REF: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
      DIR: ${{ inputs.dir }}
      PACKAGES: ${{ inputs.packages }}
      CACHE: ${{ inputs.cachix-cache }}
      PIN: ${{ inputs.cachix-pin }}
    steps:
      # The token only raises the GitHub API rate limit Nix fetches under.
      - uses: cachix/install-nix-action@v31.11.2
        with:
          github_access_token: ${{ github.token }}
      # Not the daemon: it is stopped with a fixed drain timeout, which a
      # large closure built late misses, failing a build that succeeded.
      # Scanning the store at the end pushes the same paths and waits for them.
      - uses: cachix/cachix-action@v17
        if: inputs.cachix-cache != ''
        with:
          name: ${{ inputs.cachix-cache }}
          authToken: ${{ secrets.cachix-auth-token }}
          useDaemon: false
      - name: Build
        run: |
          flake="github:${GITHUB_REPOSITORY}/${REF}${DIR:+?dir=${DIR}}"
          echo "FLAKE=${flake}" >> "$GITHUB_ENV"
          for package in $PACKAGES; do
            nix build --print-build-logs --print-out-paths --no-link "${flake}#${package}" > "out-${package}"
          done
      - name: Check the version
        run: |
          case "$REF" in
            v[0-9]*) ;;
            *) exit 0 ;;
          esac
          for package in $PACKAGES; do
            version=$(nix eval --raw "${FLAKE}#${package}.version")
            if [ "$version" != "${REF#v}" ]; then
              echo "${package} is ${version}, not the release ${REF#v}" >&2
              exit 1
            fi
            program=$(nix eval --raw "${FLAKE}#${package}.meta.mainProgram" 2>/dev/null || true)
            if [ -n "$program" ]; then
              "$(cat "out-${package}")/bin/${program}" --version | tee /dev/stderr | grep -Fqw -- "${REF#v}"
            fi
          done
      # Pushed here rather than by the cache action's post step, which runs
      # after this one: a pin needs the path in the cache already.
      - name: Pin
        if: inputs.cachix-pin != ''
        run: |
          system=$(nix eval --raw --impure --expr builtins.currentSystem)
          for package in $PACKAGES; do
            out=$(cat "out-${package}")
            cachix push "$CACHE" "$out"
            name="${PIN}-${system}"
            if [ "$package" != default ]; then
              name="${PIN}-${package}-${system}"
            fi
            cachix pin "$CACHE" "$name" "$out" --keep-revisions 3
          done
